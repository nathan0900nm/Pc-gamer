name: PC RTX 32TB pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-rdp-rtx:
    runs-on: self-hosted   # runner self-hosted com RTX + minimo 32TB livres
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: System Information + GPU + Disk Check
        run: |
          Write-Host "=== ENIGMANO RTX 32TB RDP DEPLOYMENT ===" -ForegroundColor Green
          Write-Host "Instance Number: ${{ github.event.inputs.instance_number }}" -ForegroundColor Yellow
          Write-Host "Runner: $env:RUNNER_NAME" -ForegroundColor Yellow
          Write-Host "=== SYSTEM + GPU ===" -ForegroundColor Cyan
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, TotalPhysicalMemory
          Get-WmiObject -Class Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors
          Write-Host "`n=== NVIDIA GPU ===" -ForegroundColor Magenta
          nvidia-smi 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "nvidia-smi nao encontrado" -ForegroundColor Red }
          Write-Host "`n=== DISCO (precisa >= 32TB livres) ===" -ForegroundColor Cyan
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{N='Free(TB)';E={[math]::Round($_.Free/1TB,2)}}, @{N='Used(TB)';E={[math]::Round($_.Used/1TB,2)}}

      - name: Enable RDP
        run: |
          Write-Host "Enabling Remote Desktop..." -ForegroundColor Green
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

      - name: Create User Account
        run: |
          Write-Host "Setting up user account..." -ForegroundColor Green
          $Password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "runneradmin" -ErrorAction SilentlyContinue
          Write-Host "Username: runneradmin" -ForegroundColor Yellow
          Write-Host "Password: P@ssw0rd!" -ForegroundColor Yellow

      - name: Install / Update NVIDIA Driver (RTX)
        run: |
          Write-Host "Verificando driver NVIDIA RTX..." -ForegroundColor Green
          if (Get-Command nvidia-smi -ErrorAction SilentlyContinue) {
            nvidia-smi
            Write-Host "Driver RTX presente" -ForegroundColor Green
          } else {
            Write-Host "Baixando driver NVIDIA..." -ForegroundColor Yellow
            $driverUrl = "https://us.download.nvidia.com/Windows/560.94/560.94-desktop-win10-win11-64bit-international-dch-whql.exe"
            $driverPath = "$env:TEMP\nvidia-driver.exe"
            Invoke-WebRequest -Uri $driverUrl -OutFile $driverPath
            Start-Process -FilePath $driverPath -ArgumentList "-s -noreboot" -Wait
            Write-Host "Driver instalado." -ForegroundColor Green
          }

      - name: Install Tailscale (Silent)
        run: |
          Write-Host "Downloading Tailscale..." -ForegroundColor Green
          $tsurl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsurl -OutFile $installerPath
          Write-Host "Installing Tailscale silently..." -ForegroundColor Green
          Start-Process msiexec.exe -ArgumentList "/i `"$installerPath`" /quiet /norestart" -Wait
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "Connecting to Tailscale..." -ForegroundColor Green
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=\( env:TS_AUTHKEY --hostname="enigmano-rtx32tb- \){{ github.event.inputs.instance_number }}" --accept-dns=false
          Start-Sleep -Seconds 10
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "Tailscale IP: $ip" -ForegroundColor Cyan
          Write-Host "RDP: $ip :3389" -ForegroundColor Green
          Write-Host "User: runneradmin / Pass: P@ssw0rd!" -ForegroundColor Yellow
          Write-Host "RTX + 32TB disponivel" -ForegroundColor Magenta

      - name: Keep Alive
        run: |
          Write-Host "Keeping RTX 32TB instance alive..." -ForegroundColor Green
          while ($true) {
            Start-Sleep -Seconds 300
            Write-Host "Heartbeat RTX 32TB: $(Get-Date) - Instance ${{ github.event.inputs.instance_number }}" -ForegroundColor DarkGray
            nvidia-smi --query-gpu=name,memory.used,utilization.gpu --format=csv,noheader 2>$null
          }
